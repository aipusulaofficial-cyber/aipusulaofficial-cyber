name: Reusable Engineering Contract

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      run-tests:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  engineering-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate contract manifest
        shell: bash
        run: |
          test -f .github/engineering-contract.yml
          grep -q '^version:' .github/engineering-contract.yml
          grep -q '^owner:' .github/engineering-contract.yml
          grep -q '^runtime:' .github/engineering-contract.yml
          grep -q '^test_command:' .github/engineering-contract.yml
          grep -q '^security_command:' .github/engineering-contract.yml
          grep -q '^observability:' .github/engineering-contract.yml

      - name: Setup Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python project
        if: hashFiles('pyproject.toml') != ''
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Dependency integrity
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip check

      - name: Run tests
        if: inputs.run-tests && hashFiles('pyproject.toml') != ''
        shell: bash
        run: python -m pytest -q

      - name: Build distribution
        if: inputs.run-build && hashFiles('pyproject.toml') != ''
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Node dependency integrity
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

      - name: Node tests
        if: inputs.run-tests && hashFiles('package.json') != ''
        shell: bash
        run: npm test --if-present

      - name: Generate contract evidence
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "contract_version": "1.0",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "request_id": os.environ.get("GITHUB_RUN_ID"),
              "trace_id": os.environ.get("GITHUB_RUN_ID"),
              "decision": "ALLOW",
              "stages": ["quality", "dependency_integrity", "security", "test", "build"],
          }
          Path("artifacts/engineering-contract.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-contract-evidence
          path: artifacts/engineering-contract.json

name: Reusable Engineering Contract

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      run-tests:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  engineering-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate contract manifest
        run: |
          test -f .github/engineering-contract.yml
          grep -q '^version:' .github/engineering-contract.yml
          grep -q '^owner:' .github/engineering-contract.yml
          grep -q '^runtime:' .github/engineering-contract.yml
          grep -q '^test_command:' .github/engineering-contract.yml
          grep -q '^security_command:' .github/engineering-contract.yml
          grep -q '^observability:' .github/engineering-contract.yml

      - name: Setup Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python project
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Python dependency integrity
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip check

      - name: Python security audit
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Python test quality gate
        if: hashFiles('**/test_*.py') != '' || hashFiles('**/*_test.py') != ''
        run: |
          python -m pip install pytest hypothesis httpx2 pytest-asyncio jsonschema
          python - <<'PY'
          from pathlib import Path
          import re
          bad = []
          for p in list(Path(".").rglob("test_*.py")) + list(Path(".").rglob("*_test.py")):
              if ".git" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if re.search(r"assert\s+(True|1\s*==\s*1)\s*$", text, re.M):
                  bad.append(str(p))
          if bad:
              raise SystemExit("No-op tests detected: " + ", ".join(bad))
          PY

      - name: Runtime evidence implementation
        if: hashFiles('runtime_evidence.py') != ''
        shell: bash
        run: |
          python - <<'PY'
          import importlib, json, time
          from pathlib import Path
          from jsonschema import validate
          mod = importlib.import_module("runtime_evidence")
          evidence = mod.runtime_evidence(request_id="ci-smoke-request", stage="ci.runtime-evidence", decision="ALLOW", started=time.perf_counter())
          required = {"request_id","trace_id","stage","decision","timestamp","latency_ms","error","cost_usd"}
          missing = required - evidence.keys()
          if missing: raise SystemExit(f"runtime evidence missing fields: {sorted(missing)}")
          schema_path = Path("platform/runtime_contract.schema.json")
          if schema_path.exists():
              validate(instance=evidence, schema=json.loads(schema_path.read_text(encoding="utf-8")))
          print("runtime evidence schema: PASS")
          PY

      - name: Python tests
        if: inputs.run-tests && hashFiles('pyproject.toml') != ''
        run: python -m pytest -q --asyncio-mode=auto

      - name: Python build
        if: inputs.run-build && hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Node dependency integrity and security
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

      - name: Node tests
        if: inputs.run-tests && hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Runtime contract schema
        if: hashFiles('platform/runtime_contract.schema.json') != ''
        run: python -m json.tool platform/runtime_contract.schema.json >/dev/null

      - name: Generate contract evidence
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          evidence = {
              "contract_version": "1.0",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "request_id": os.environ.get("GITHUB_RUN_ID"),
              "trace_id": os.environ.get("GITHUB_RUN_ID"),
              "stage": "engineering-contract",
              "decision": "ALLOW",
              "timestamp": int(time.time()),
              "latency_ms": 0,
              "error": None,
              "cost_usd": 0,
              "checks": ["manifest", "dependency_integrity", "security", "test", "build"],
          }
          Path("artifacts/engineering-contract.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-contract-evidence
          path: artifacts/engineering-contract.json

      - name: Attest build provenance
        if: inputs.run-build && hashFiles('pyproject.toml') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

name: End-to-End Platform Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run integration contract
        working-directory: platform
        run: python -m pytest test_end_to_end.py -q
      - name: Generate trace evidence
        working-directory: platform
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from test_end_to_end import run_flow

          Path("../artifacts").mkdir(exist_ok=True)
          Path("../artifacts/integration-trace.json").write_text(
              json.dumps(run_flow(), indent=2), encoding="utf-8"
          )
          PY
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: aipusula-end-to-end-trace
          path: artifacts/integration-trace.json

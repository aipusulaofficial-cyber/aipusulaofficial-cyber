name: End-to-End Platform Integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run integration contract
        working-directory: platform
        run: python -m pytest test_end_to_end.py -q
      - name: Generate trace evidence
        working-directory: platform
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from test_end_to_end import run_flow
          Path("../artifacts").mkdir(exist_ok=True)
          Path("../artifacts/integration-trace.json").write_text(json.dumps(run_flow(), indent=2), encoding="utf-8")
          PY
      - name: Upload integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aipusula-end-to-end-trace
          path: artifacts/integration-trace.json

name: Platform Health Matrix
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # This trusted schedule/manual workflow commits the refreshed matrix.
          persist-credentials: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Refresh matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python platform/update_health_matrix.py
      - name: Commit matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/health-matrix.json docs/PLATFORM-HEALTH-MATRIX.md
          git diff --cached --quiet || git commit -m "chore: refresh platform health matrix"
          git push
